[package]
name = "dataflux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["DataFlux Contributors"]
description = "A modular, high-performance, secure file transfer and data management platform."
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/your-username/dataflux"
homepage = "https://github.com/your-username/dataflux"
documentation = "https://docs.rs/dataflux"
keywords = [
    "file-transfer",
    "file-copy",
    "backup",
    "synchronization",
    "networking"
]
categories = [
    "command-line-utilities",
    "filesystem",
    "network-programming"
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
hex = "0.4"
parking_lot = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
criterion = "0.7"
predicates = "3"
tempfile = "3"

[[bin]]
name = "dataflux"
path = "src/main.rs"

[lib]
name = "dataflux"
path = "src/lib.rs"

[[bench]]
name = "copy_benchmark"
harness = false

[[bench]]
name = "parallel_benchmark"
harness = false

[[bench]]
name = "filesystem_benchmark"
harness = false

[[bench]]
name = "network_benchmark"
harness = false

[[bench]]
name = "verification_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
